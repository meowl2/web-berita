<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArusTeknologi — Admin</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/dashboard.css" />
    <link rel="stylesheet" href="style/admin.css" />
  </head>
  <body>
    <nav>
      <img class="logo" src="assets/main/logo_2.png" alt="" />
      <button class="nav_hamburger" id="nav_hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul id="nav_menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <main class="dashboard_container">
      <div class="dashboard_header">
        <h1>Admin Panel</h1>
      </div>

      <div class="admin_tabs">
        <button class="admin_tab active" data-status="pending">Pending</button>
        <button class="admin_tab" data-status="published">Published</button>
        <button class="admin_tab" data-status="rejected">Rejected</button>
      </div>

      <div class="dashboard_stats" id="admin_stats"></div>
      <div class="dashboard_list" id="admin_list"></div>
    </main>

   <footer>
      <div class="footer_inner">
        <div class="footer_brand">
          <div class="footer_logo">ArusTeknologi</div>
          <p>Platform berita teknologi.</p>
        </div>

        <div class="footer_links">
          <div class="footer_col">
            <h4>Navigasi</h4>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
          </div>
          <div class="footer_col">
            <h4>Lainnya</h4>
            <a href="#about">Tentang Kami</a>
            <a href="#contact">Kontak</a>
          </div>
        </div>
      </div>

      <div class="footer_bottom">
        <p>&copy; 2026 ArusTeknologi.</p>
      </div>
    </footer>

    <!-- edit -->
     <div id="edit_modal" class="modal_overlay" role="dialog" aria-modal="true">
      <div class="modal_box">
        <div class="modal_header">
          <h2>Edit Berita</h2>
          <button id="close_edit_modal" class="modal_close">&#x2715;</button>
        </div>
        <form id="edit_form" novalidate>
          <input type="hidden" id="edit_news_id" />
          <div class="form_group">
            <label for="edit_title">Judul Berita</label>
            <input type="text" id="edit_title" maxlength="100" required />
          </div>
          <div class="form_group">
            <label for="edit_author">Penulis</label>
            <input type="text" id="edit_author" maxlength="50" required />
          </div>
          <div class="form_group">
            <label for="edit_desc">Deskripsi Singkat</label>
            <textarea id="edit_desc" rows="2" maxlength="150" required></textarea>
          </div>
          <div class="form_group">
            <label for="edit_content">Isi Berita</label>
            <div class="editor_toolbar">
              <button type="button" id="edit_btn_bold"><strong>B</strong></button>
              <button type="button" id="edit_btn_italic"><em>I</em></button>
            </div>
            <textarea id="edit_content" rows="6" required></textarea>
          </div>
          <div class="form_group">
            <label for="edit_image">Gambar Baru (kosongkan jika tidak diganti)</label>
            <label class="file_upload_label" for="edit_image">
              <span>&#128247; Pilih Gambar</span>
              <input type="file" id="edit_image" accept="image/*" />
            </label>
            <img id="edit_image_preview" class="hidden" alt="Preview" />
          </div>
          <div class="form_actions">
            <button type="button" id="close_edit_modal_2" class="btn_secondary">Batal</button>
            <button type="submit" class="btn_primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="program/admin.js"></script>
  </body>
</html>
