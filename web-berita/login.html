<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArusTeknologi — Login</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/auth.css" />
  </head>
  <body>
    <nav>
      <img class="logo" src="assets/main/logo_2.png" alt="" />
      <button class="nav_hamburger" id="nav_hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul id="nav_menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    </nav>

    <main class="auth_container">
      <div class="auth_box">
        <div class="auth_tabs">
          <button class="auth_tab active" id="tab_login">Masuk</button>
          <button class="auth_tab" id="tab_register">Daftar</button>
        </div>

        <!-- Login form -->
        <form id="login_form">
          <div class="form_group">
            <label for="login_email">Email</label>
            <input
              type="email"
              id="login_email"
              placeholder="email@kamu.com"
              required
            />
          </div>
          <div class="form_group">
            <label for="login_password">Password</label>
            <input
              type="password"
              id="login_password"
              placeholder="••••••••"
              required
            />
          </div>
          <p id="login_error" class="auth_error hidden"></p>
          <button type="submit" class="btn_primary auth_submit">Masuk</button>
        </form>

        <!-- Register form -->
        <form id="register_form" class="hidden">
          <div class="form_group">
            <label for="reg_username">Username</label>
            <input
              type="text"
              id="reg_username"
              placeholder="Username kamu..."
              maxlength="30"
              required
            />
          </div>
          <div class="form_group">
            <label for="reg_email">Email</label>
            <input
              type="email"
              id="reg_email"
              placeholder="email@kamu.com"
              required
            />
          </div>
          <div class="form_group">
            <label for="reg_password">Password</label>
            <input
              type="password"
              id="reg_password"
              placeholder="Min. 6 karakter"
              minlength="6"
              required
            />
          </div>
          <p id="reg_error" class="auth_error hidden"></p>
          <p id="reg_success" class="auth_success hidden"></p>
          <button type="submit" class="btn_primary auth_submit">Daftar</button>
        </form>
      </div>
    </main>

    <footer>
      <div class="footer_inner">
        <div class="footer_brand">
          <div class="footer_logo">ArusTeknologi</div>
          <p>Platform berita teknologi.</p>
        </div>

        <div class="footer_links">
          <div class="footer_col">
            <h4>Navigasi</h4>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
          </div>
          <div class="footer_col">
            <h4>Lainnya</h4>
            <a href="#about">Tentang Kami</a>
            <a href="#contact">Kontak</a>
          </div>
        </div>
      </div>

      <div class="footer_bottom">
        <p>&copy; 2026 ArusTeknologi.</p>
      </div>
    </footer>

    <script type="module" src="program/auth.js"></script>
  </body>
</html>
