<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
 <link rel="stylesheet" href="style/user.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo"><i class="fas fa-lock"></i></div>
      <h1>Wellcome</h1>
      <p>Masuk ke akun Anda untuk melanjutkan</p>
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" class="form-input" placeholder="Masukkan email Anda" required />
        </div>
        <div id="emailError" class="error-message">Email tidak valid</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" class="form-input" placeholder="Masukkan password Anda" required />
        </div>
        <div id="passwordError" class="error-message">Password harus diisi</div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" class="checkbox" id="remember" />
          <span>Ingat saya</span>
        </label>
        <a href="#" class="forgot-password">Lupa password?</a>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Masuk</button>
    </form>

    <div class="divider"><span class="divider-text">Atau masuk dengan</span></div>

    <div class="social-login">
      <button class="social-btn google-btn"><i class="fab fa-google"></i> Google</button>
      <button class="social-btn facebook-btn"><i class="fab fa-facebook-f"></i> Facebook</button>
    </div>

    <div class="signup-link">
      <span class="signup-text">Belum punya akun? </span>
      <a id="openRegister" href="#">Daftar sekarang</a>
    </div>
  </div>

  <!-- Modal Daftar -->
  <div class="modal" id="registerModal">
    <div class="modal-content">
      <span class="close-btn" id="closeRegister">&times;</span>
      <h2>Daftar Akun Baru</h2>
      <form id="registerForm">
        <label for="regName">Nama Lengkap</label>
        <input type="text" id="regName" placeholder="Masukkan nama lengkap" required />
        <div id="nameError" class="error-message">Nama harus diisi</div>

        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="Masukkan email" required />
        <div id="regEmailError" class="error-message">Email tidak valid</div>

        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Masukkan password" required />
        <div id="regPasswordError" class="error-message">Password minimal 6 karakter</div>

        <button type="submit">Daftar</button>
      </form>
    </div>
  </div>
<script>
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

// LOGIN
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost/login-app/login.php", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ email, password })
});

  const data = await res.json();
  alert(data.message);

  if (data.success) {
    window.location.href = "dashboard.html";
  }
});

// REGISTER
registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("regName").value;
  const email = document.getElementById("regEmail").value;
  const password = document.getElementById("regPassword").value;

  const res = await fetch("http://localhost/login-app/register.php", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ name, email, password })
});

  const data = await res.json();
  alert(data.message);
});
</script>
