<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitMedia — Login</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/auth.css" />
  </head>
  <body>
    <nav>
      <div class="logo">BitMedia</div>
      <ul>
        <li><a href="index.html">Home</a></li>
      </ul>
    </nav>

    <main class="auth_container">
      <div class="auth_box">
        <div class="auth_tabs">
          <button class="auth_tab active" id="tab_login">Masuk</button>
          <button class="auth_tab" id="tab_register">Daftar</button>
        </div>

        <!-- Login form -->
        <form id="login_form">
          <div class="form_group">
            <label for="login_email">Email</label>
            <input type="email" id="login_email" placeholder="email@kamu.com" required />
          </div>
          <div class="form_group">
            <label for="login_password">Password</label>
            <input type="password" id="login_password" placeholder="••••••••" required />
          </div>
          <p id="login_error" class="auth_error hidden"></p>
          <button type="submit" class="btn_primary auth_submit">Masuk</button>
        </form>

        <!-- Register form -->
        <form id="register_form" class="hidden">
          <div class="form_group">
            <label for="reg_username">Username</label>
            <input type="text" id="reg_username" placeholder="Username kamu..." maxlength="30" required />
          </div>
          <div class="form_group">
            <label for="reg_email">Email</label>
            <input type="email" id="reg_email" placeholder="email@kamu.com" required />
          </div>
          <div class="form_group">
            <label for="reg_password">Password</label>
            <input type="password" id="reg_password" placeholder="Min. 6 karakter" minlength="6" required />
          </div>
          <p id="reg_error" class="auth_error hidden"></p>
          <p id="reg_success" class="auth_success hidden"></p>
          <button type="submit" class="btn_primary auth_submit">Daftar</button>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 BitMedia</p>
    </footer>

    <script type="module" src="program/auth.js"></script>
  </body>
</html>
