  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/news-detail.css" />
  </head>

  <body>
    <nav>
      <img class="logo" src="assets/main/logo_2.png" alt="" />
      <button class="nav_hamburger" id="nav_hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul id="nav_menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="#contact">Contact</a></li>

      <img class="logo" src="assets/main/logo_2.png" alt="">
      <ul>
        <li><a href="#home">Home</a></li>

    <header id="home" class="hero">
      <img src="assets/main/logo_1.png" alt="" />
    </header>

    <main class="container">
      <!-- Section 1 -->
      <div class="berita_sect_1" id="sect1_dynamic"></div>

      <!-- Section 2 -->
      <div class="berita_sect_2">
        <h2>BERITA MINGGU LALU</h2>
        <div class="berita_sect_2_main" id="sect2_dynamic"></div>
      </div>

      <!-- Section 3 — Viral (dynamic) -->
      <div class="berita_sect_3">
        <div class="sect3_header">
          <h2>PILIHAN EDITOR</h2>
          <div class="sect3_nav">
            <span id="sect3_indicator">1 / 1</span>
            <button id="prev_sect3">&#8592;</button>
            <button id="next_sect3">&#8594;</button>
          </div>
        </div>

        <div class="sect3_wrapper">
          <div id="sect3_dynamic_wrapper"></div>
        </div>
      </div>

      <!-- Services / About -->
      <div class="services">
        <section id="layanan">
          <h2>Layanan Kami</h2>
          <p>
            Penjelasan singkat mengenai apa yang ditawarkan oleh ArusTeknologi.
          </p>
        </section>

        <hr />

        <section id="about">
          <h2>Tentang Kami</h2>
          <p>Informasi lebih lanjut mengenai visi dan misi proyek ini.</p>
        </section>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 ArusTeknologi</p>
    </footer>

    <!-- Upload Modal -->
    <div
      id="upload_modal"
      class="modal_overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal_title"
    >
      <div class="modal_box">
        <div class="modal_header">
          <h2 id="modal_title">Unggah Berita</h2>
          <button id="close_modal" class="modal_close" aria-label="Tutup modal">
            &#x2715;
          </button>
        </div>

        <form id="upload_form" novalidate>
          <div class="form_group">
            <label for="news_title">Judul Berita</label>
            <input
              type="text"
              id="news_title"
              placeholder="Masukkan judul berita..."
              maxlength="100"
              required
            />
          </div>

          <!-- <div class="form_group">
            <label for="news_author">Penulis</label>
            <input type="text" id="news_author" placeholder="Nama penulis..." maxlength="50" required />
          </div> -->

          <div class="form_group">
            <label for="news_desc">Deskripsi Singkat</label>
            <textarea
              id="news_desc"
              placeholder="Tulis deskripsi singkat (tampil di kartu)..."
              rows="2"
              maxlength="300"
              required
            ></textarea>
          </div>

          <div class="form_group">
            <label for="news_content">Isi Berita</label>
            <div class="editor_toolbar">
              <button type="button" id="btn_bold"><strong>B</strong></button>
              <button type="button" id="btn_italic"><em>I</em></button>
            </div>
            <textarea
              id="news_content"
              placeholder="Tulis isi lengkap berita di sini..."
              rows="6"
              required
            ></textarea>
          </div>

          <div class="form_group">
            <label for="news_image">Gambar (maks. 5MB)</label>
            <label class="file_upload_label" for="news_image">
              <span>&#128247; Pilih Gambar</span>
              <input type="file" id="news_image" accept="image/*" required />
            </label>
            <img id="image_preview" class="hidden" alt="Preview gambar" />
          </div>

          <div class="form_actions">
            <button type="button" id="close_modal_2" class="btn_secondary">
              Batal
            </button>
            <button type="submit" class="btn_primary">Publikasikan</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/scrollreveal"></script>
    <script type="module" src="program/main.js"></script>
    <script type="module" src="program/news.js"></script>
  </body>
</html>
